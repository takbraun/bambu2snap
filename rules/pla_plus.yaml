name: Generic PLA+ tuning
description: >
  Speed, acceleration, and first-layer overrides for generic PLA+ (any vendor).
  No vendor restriction — covers non-Bambu PLA+ and any PLA filament not matched
  by a more specific rule. Priority 5 sits above the Bambu-only pla.yaml (0) but
  below variant-specific rules like pla_matte and silk_pla (10), so those still win.
  Temperatures are ceilings: they only fire if the source file exceeds the limit.
  For actual PLA+ temp enforcement, use the "Filament" dropdown in the UI.
match:
  filament_type: PLA
overrides:
  nozzle_temperature: 235
  nozzle_temperature_initial_layer: 235
  # First layer — critical fixes for bed adhesion on U1
  initial_layer_speed: 25
  initial_layer_infill_speed: 25
  initial_layer_travel_speed: 150
  initial_layer_acceleration: 500
  # General speeds — values >= pla.yaml so Bambu PLA files keep pla.yaml's effective ceilings.
  # pla_matte/silk still override these at priority 10.
  outer_wall_speed: 150
  inner_wall_speed: 250
  sparse_infill_speed: 250
  internal_solid_infill_speed: 250
  top_surface_speed: 80
  gap_infill_speed: 80
  travel_speed: 300
  # Accelerations — must be >= pla.yaml values to avoid clamping Bambu PLA below intended ceilings
  default_acceleration: 4000
  outer_wall_acceleration: 2500
  inner_wall_acceleration: 4000
priority: 5
enabled: true
